<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кері байланыс</title>
<link rel="icon" href="img/bilemin.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6E6; --ink:#1B2559; --muted:#6B7393; --card:#fff;
    --blue:#1E7BE0; --orange:#FF9A1F; --green:#18A673; --line:#F0DFC2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:var(--bg) radial-gradient(circle at 1px 1px,#F3DDB5 1.5px,transparent 0) 0 0/22px 22px;
    min-height:100vh; padding:16px 16px 40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  h1{font-weight:900;font-size:26px;margin:6px 0 2px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 0 16px;font-weight:600}
  .room{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;font-size:14px}
  .step{font-weight:800;margin:18px 4px 8px;font-size:17px}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .choice{
    appearance:none;border:3px solid transparent;background:var(--card);border-radius:20px;
    padding:8px 6px 10px;cursor:pointer;box-shadow:0 4px 0 var(--line);
    transition:transform .15s,border-color .15s,box-shadow .15s;font:inherit;color:inherit;
  }
  .choice img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}
  .choice span{display:block;font-weight:800;font-size:13px;line-height:1.15;margin-top:4px}
  .choice[aria-pressed="true"]{border-color:var(--c);transform:translateY(-3px);box-shadow:0 7px 0 var(--c)}
  .choice:active{transform:scale(.97)}
  textarea,input{
    width:100%;border:3px solid var(--line);border-radius:16px;background:#fff;
    font:inherit;font-weight:600;font-size:18px;color:var(--ink);padding:12px 14px;outline:none;
  }
  textarea{min-height:120px;resize:vertical}
  textarea:focus,input:focus{border-color:var(--blue)}
  .count{text-align:right;color:var(--muted);font-size:13px;margin-top:4px}
  button.send{
    width:100%;margin-top:18px;border:0;border-radius:18px;padding:16px;
    background:var(--orange);color:#fff;font:inherit;font-weight:900;font-size:20px;
    box-shadow:0 5px 0 #D97A08;cursor:pointer;
  }
  button.send:disabled{background:#C9C2B4;box-shadow:0 5px 0 #A9A190;cursor:not-allowed}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);visibility:hidden;
    background:var(--green);color:#fff;font-weight:800;padding:14px 22px;border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .3s;max-width:calc(100% - 32px);text-align:center
  }
  .toast.show{transform:translate(-50%,0);visibility:visible}
  .toast.err{background:#D9443B}
  .notice{background:#fff;border:3px dashed var(--orange);border-radius:16px;padding:14px;font-weight:700;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Кері байланыс ✍️</h1>
  <p class="sub">Сабақ: <span class="room" id="roomName">—</span></p>

  <div class="notice" id="notice">Бет әлі бапталмаған: мұғалім config.js файлына Firebase баптауларын енгізуі керек.</div>

  <div class="step">1. Сұрақты таңда</div>
  <div class="choices" id="choices">
    <button class="choice" data-col="bilemin" style="--c:var(--blue)" aria-pressed="false">
      <img src="img/bilemin.png" alt=""><span>Не білесің?</span></button>
    <button class="choice" data-col="bilgim" style="--c:var(--orange)" aria-pressed="false">
      <img src="img/bilgim.png" alt=""><span>Не білгің келеді?</span></button>
    <button class="choice" data-col="bildim" style="--c:var(--green)" aria-pressed="false">
      <img src="img/bildim.png" alt=""><span>Не білдің?</span></button>
  </div>

  <div class="step">2. Жауабыңды жаз</div>
  <textarea id="text" maxlength="300" placeholder="Осында жаз..."></textarea>
  <div class="count"><span id="cnt">0</span>/300</div>

  <div class="step">3. Атың <span style="color:var(--muted);font-weight:600">(міндетті емес)</span></div>
  <input id="name" maxlength="40" placeholder="Мысалы: Айжан">

  <button class="send" id="send" disabled>Жіберу 🚀</button>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">

  const params = new URLSearchParams(location.search);
  const room = (params.get("room") || "sabak").replace(/[.#$\[\]\/]/g, "-").slice(0, 60);
  document.getElementById("roomName").textContent = room;

  const $ = id => document.getElementById(id);
  let col = params.get("q");
  const cfg = window.FIREBASE_CONFIG || {};
  let db = null, fb = {};
  async function connect() {
    if (!cfg.databaseURL) { $("notice").style.display = "block"; return; }
    try {
      const app = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      fb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      db = fb.getDatabase(app.initializeApp(cfg));
    } catch (e) {
      $("notice").textContent = "Байланыс орнамады. Интернетті тексеріп, бетті жаңартыңыз.";
      $("notice").style.display = "block";
    }
    update();
  }

  try { $("name").value = localStorage.getItem("kb-name") || ""; } catch (e) {}

  function setChoice(c) {
    col = c;
    document.querySelectorAll(".choice").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.col === c)));
    update();
  }
  function update() {
    const len = $("text").value.trim().length;
    $("cnt").textContent = $("text").value.length;
    $("send").disabled = !(db && col && len > 0);
  }
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => setChoice(b.dataset.col));
  $("text").oninput = update;
  if (col) setChoice(col);
  connect();

  let timer;
  function toast(msg, err) {
    const t = $("toast");
    t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
    clearTimeout(timer); timer = setTimeout(() => t.className = "toast", 2600);
  }

  $("send").onclick = async () => {
    const text = $("text").value.trim();
    const name = $("name").value.trim();
    if (!text || !col) return;
    $("send").disabled = true;
    try { localStorage.setItem("kb-name", name); } catch (e) {}
    const data = { col, text, ts: fb.serverTimestamp() };
    if (name) data.name = name;
    try {
      await fb.push(fb.ref(db, `rooms/${room}/answers`), data);
      $("text").value = "";
      toast("Жіберілді! Рақмет 🎉");
    } catch (e) {
      toast("Жіберілмеді. Интернетті тексеріп, қайта көр.", true);
    }
    update();
  };
</script>
</body>
</html>
