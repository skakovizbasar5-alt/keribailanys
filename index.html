<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кері байланыс</title>
<link rel="icon" href="img/bilemin.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6E6; --ink:#1B2559; --muted:#6B7393; --card:#fff;
    --blue:#1E7BE0; --orange:#FF9A1F; --green:#18A673; --line:#F0DFC2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:var(--bg) radial-gradient(circle at 1px 1px,#F3DDB5 1.5px,transparent 0) 0 0/22px 22px;
    min-height:100vh; padding:16px 16px 40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .kicker{text-align:center;color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
  h1{font-weight:900;font-size:24px;line-height:1.2;margin:4px 0 14px;text-align:center}
  .q{
    background:var(--card);border-radius:22px;padding:10px 14px 14px;margin-bottom:14px;
    border:3px solid var(--c);box-shadow:0 5px 0 var(--line);
  }
  .q img{display:block;height:130px;max-width:100%;margin:0 auto 6px;object-fit:contain}
  label.lbl{display:block;font-weight:900;font-size:17px;margin:0 2px 6px}
  textarea,input{
    width:100%;border:3px solid var(--line);border-radius:14px;background:#fff;
    font:inherit;font-weight:600;font-size:17px;color:var(--ink);padding:10px 12px;outline:none;
  }
  textarea{min-height:92px;resize:vertical}
  textarea:focus,input:focus{border-color:var(--c,var(--blue))}
  .count{text-align:right;color:var(--muted);font-size:12px;margin-top:3px}
  .name{margin:4px 0 0}
  button.send{
    width:100%;margin-top:18px;border:0;border-radius:18px;padding:16px;
    background:var(--orange);color:#fff;font:inherit;font-weight:900;font-size:20px;
    box-shadow:0 5px 0 #D97A08;cursor:pointer;
  }
  button.send:disabled{background:#C9C2B4;box-shadow:0 5px 0 #A9A190;cursor:not-allowed}
  .hint{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:10px}
  .notice{background:#fff;border:3px dashed var(--orange);border-radius:16px;padding:14px;font-weight:700;display:none;margin-bottom:14px}
  .done{display:none;text-align:center;padding-top:30px}
  .done img{width:min(320px,80%)}
  .done h2{font-weight:900;font-size:28px;margin:10px 0 6px}
  .done p{color:var(--muted);font-weight:700;margin:0 0 18px}
  .done button{border:0;background:none;color:var(--blue);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);visibility:hidden;
    background:#D9443B;color:#fff;font-weight:800;padding:14px 22px;border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .3s;max-width:calc(100% - 32px);text-align:center
  }
  .toast.show{transform:translate(-50%,0);visibility:visible}
</style>
</head>
<body>
<div class="wrap" id="form">
  <div class="kicker">Кері байланыс</div>
  <h1 id="topic">—</h1>

  <div class="notice" id="notice">Бет әлі бапталмаған: мұғалім config.js файлына Firebase баптауларын енгізуі керек.</div>

  <div class="q" style="--c:var(--blue)">
    <img src="img/bilemin.png" alt="">
    <label class="lbl" for="t-bilemin">1. Бұл тақырып туралы не білесің?</label>
    <textarea id="t-bilemin" maxlength="300" placeholder="Мен білемін..."></textarea>
    <div class="count"><span>0</span>/300</div>
  </div>

  <div class="q" style="--c:var(--orange)">
    <img src="img/bilgim.png" alt="">
    <label class="lbl" for="t-bilgim">2. Не білгің келеді?</label>
    <textarea id="t-bilgim" maxlength="300" placeholder="Мен білгім келеді..."></textarea>
    <div class="count"><span>0</span>/300</div>
  </div>

  <div class="q" style="--c:var(--green)">
    <img src="img/bildim.png" alt="">
    <label class="lbl" for="t-bildim">3. Сабақтан не білдің?</label>
    <textarea id="t-bildim" maxlength="300" placeholder="Бүгін мен білдім..."></textarea>
    <div class="count"><span>0</span>/300</div>
  </div>

  <div class="q" style="--c:var(--ink)">
    <label class="lbl" for="name">Аты-жөнің</label>
    <input id="name" class="name" maxlength="40" placeholder="Мысалы: Айжан Серікова">
  </div>

  <button class="send" id="send" disabled>Жіберу 🚀</button>
  <div class="hint" id="hint">Үш сұраққа да жауап жазып, атыңды көрсет</div>
</div>

<div class="wrap done" id="done">
  <img src="img/bildim.png" alt="">
  <h2>Рақмет! 🎉</h2>
  <p>Жауаптарың тақтаға түсті.</p>
  <button id="again">Тағы жауап жіберу</button>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
  const $ = id => document.getElementById(id);
  const COLS = ["bilemin", "bilgim", "bildim"];
  const params = new URLSearchParams(location.search);
  const DEFAULT = "Қазақ тілі сабағында ЖИ құралдарын тиімді пайдалану жолдары";
  const room = (params.get("room") || DEFAULT).replace(/[.#$\[\]\/]/g, "-").slice(0, 100);
  $("topic").textContent = room === DEFAULT ? "«" + room + "» коучинг-семинары" : room;
  document.title = $("topic").textContent + " · Кері байланыс";

  const cfg = window.FIREBASE_CONFIG || {};
  let db = null, fb = {};
  async function connect() {
    if (!cfg.databaseURL) { $("notice").style.display = "block"; return; }
    try {
      const app = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      fb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      db = fb.getDatabase(app.initializeApp(cfg));
    } catch (e) {
      $("notice").textContent = "Байланыс орнамады. Интернетті тексеріп, бетті жаңартыңыз.";
      $("notice").style.display = "block";
    }
    update();
  }

  try { $("name").value = localStorage.getItem("kb-name") || ""; } catch (e) {}

  function update() {
    let missing = 0;
    COLS.forEach(c => {
      const el = $("t-" + c);
      el.parentElement.querySelector(".count span").textContent = el.value.length;
      if (!el.value.trim()) missing++;
    });
    const noName = !$("name").value.trim();
    $("send").disabled = !(db && !missing && !noName);
    $("hint").textContent = missing
      ? `Тағы ${missing} сұраққа жауап жаз`
      : noName ? "Атыңды жаз" : "Бәрі дайын, жібере бер!";
  }
  COLS.forEach(c => $("t-" + c).oninput = update);
  $("name").oninput = update;
  update();
  connect();

  let timer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.className = "toast show";
    clearTimeout(timer); timer = setTimeout(() => t.className = "toast", 3000);
  }

  $("send").onclick = async () => {
    const name = $("name").value.trim();
    $("send").disabled = true;
    try { localStorage.setItem("kb-name", name); } catch (e) {}
    const base = fb.ref(db, `rooms/${room}/answers`);
    const updates = {};
    COLS.forEach(c => {
      updates[fb.push(base).key] = { col: c, text: $("t-" + c).value.trim(), name, ts: fb.serverTimestamp() };
    });
    try {
      await fb.update(base, updates);          // үш жауап бірге сақталады
      COLS.forEach(c => $("t-" + c).value = "");
      $("form").style.display = "none";
      $("done").style.display = "block";
      scrollTo(0, 0);
    } catch (e) {
      toast("Жіберілмеді. Интернетті тексеріп, қайта көр.");
    }
    update();
  };
  $("again").onclick = () => {
    $("done").style.display = "none";
    $("form").style.display = "block";
  };
</script>
</body>
</html>
